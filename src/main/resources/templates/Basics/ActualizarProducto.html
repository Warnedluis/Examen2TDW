<!DOCTYPE html>
<html lang="es" xmlns:th = "http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papelería | Crear Producto</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <link rel="stylesheet" href="/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a th:href="@{/TablasFormulariosLuis/MostrarTablaAutores}"><b>Papelería</b> Productos</a>
  </div>
  
  <div class="card card-outline card-primary">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Rellena los datos para actualizar un producto o servicio de la papalería</p>

      
      <form th:action="@{/Productos/ActualizarProducto}" th:object="${producto}" method="post">

        <div class="input-group mb-3">
          <input type="number" class="form-control" th:field="*{idProducto}" placeholder="id del producto" readonly>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="text" class="form-control" th:field="*{nombreProducto}" placeholder="Nombre del producto" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="text" class="form-control" th:field="*{costoUnitarioProducto}" placeholder="Costo unitario del producto" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-globe-americas"></span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Crear producto</button>
          </div>
        </div>
      </form>

      <p class="mt-3 mb-1 text-center">
        <a th:href="@{/TablasFormulariosLuis/MostrarTablaAutores}">Regresar a la tabla de los productos</a>
      </p>
    </div>
  </div>
</div>
<script src="/plugins/jquery/jquery.min.js"></script>
<script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/dist/js/adminlte.min.js"></script>
</body>
</html>
